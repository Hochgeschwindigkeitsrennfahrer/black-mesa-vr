// Black Mesa VR: stronger FXAA for the headset (less edge shimmer, slightly softer image).
// Needs FXAA picked in Options -> Video (Anti-aliasing). Run in the console: exec bmvr_aa_strong
// To keep it, add the line "exec bmvr_aa_strong" to bms\cfg\bmvr_local.cfg.
// Back to the normal tuning: exec bmvr_aa_default (or restart the game; none of this is saved).
mat_fxaa_enabled 1
mat_fxaa_subpixel_Q 1.0            // sub-pixel AA, default 0.75, 1.0 = max (softer)
mat_fxaa_edge_threshold_Q 0.063    // lower = more edges treated (0.063 = 'overkill')
mat_fxaa_edge_threshold_min_Q 0.0312
mat_fxaa_subpixel_C 0.5            // console-path variants, in case that path is used
mat_fxaa_edge_threshold_C 0.125
mat_fxaa_edge_sharpness_C 2.0
mat_fxaa_edge_threshold_min_C 0.0312
echo "bmvr_aa_strong applied"
