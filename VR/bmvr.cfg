// Black Mesa VR. Run by the VR mod once per game start, after autoexec.cfg and
// config.cfg (no autoexec.cfg line needed). For your own overrides, create
// bms\cfg\bmvr_local.cfg next to this file; the mod runs it right after.
// Desktop crosshair does not follow the controller.
crosshair 0
hud_crosshair_enable 0
// The desktop window loses focus while the headset is in use.
engine_no_focus_sleep 0
// Aim assist bends shots away from where the controller points.
sk_autoaim_mode 0
sk_autoaim_enabled 0
// Motion blur follows head turns in VR.
mat_motion_blur_enabled 0
