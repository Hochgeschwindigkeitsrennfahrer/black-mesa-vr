// Black Mesa VR — exec'd from autoexec.cfg. Do not ClientCmd these from Present.
// ICvar SetConVarInt from the first RenderView also writes them (xor'd int at
// +0x30). Client.dll cvars may not exist yet at autoexec, so both paths matter.
// Flashlight cvars still must NOT be added — they broke deferred
// __GBLightSpot_FlashLight after fused-6DoF. Never nr_lights_active 0.
crosshair 0
hud_crosshair_enable 0

// mat_queue_mode is owned by the DLL: menu and pass-through stay 0,
// then SetThreadMode(2) after stereo warmup (MulticoreMode=true).
// Do not force 0 or 2 here — autoexec runs too early and fights that.

// Restore PVS / HW occlusion. Do not force r_portalsopenall — that draws
// every leaf. ForceOpenVis=true in VR\config.txt is the old occlusion-off
// + portals-open pair if an eye ever latches skybox-only.
// r_visocclusion is a debug overlay (cheat), not HW occlusion — keep it 0.
r_occlusion 1
r_fastzreject 1
r_visocclusion 0
r_portalsopenall 0

// Do NOT put back: cl_csm_enabled 0, nr_shadow_active 0,
// nr_dev_gb_debug_type 1, r_lod 2 — verified unplayable in the first-soldier
// fight (gbDepth stayed 4; combat ~27fps + 62ms hitch).
// Do not write cl_csm_qualitymode / nr_shadow_quality / nr_lights_quality /
// r_shadowrendertotexture — those ARCHIVE and reset the video menu to Low.
cl_csm_enabled 1
cl_csm_cascade_dynamic_ignore 0
nr_shadow_active 1
nr_lights_procedural_disable_all_lights 0
nr_dev_shoot_lights_enabled 1
nr_dev_gb_debug_type 2
gb_flashlight_shadow_enabled 1
cl_dlight_manager_enable 1
r_dynamic 1
r_maxdlights 32
r_lod -1
r_rootlod 0
r_eyes 1
r_teeth 1
flex_smooth 1
r_drawflecks 1
mat_reduceparticles 0
cl_new_impact_effects 1
nr_allow_hammer_nerfs 0
nr_allow_hammer_nerfs_4ways 0
nr_gbuffer_for_refraction_enabled 0
// User 2026-09-06: refraction-only costs no noticeable FPS and looks better
// than the cheap fog fill. Keep planar reflection / expensive / gbuffer
// reflection off (that full set was the 47→32 FPS hit).
r_WaterDrawRefraction 1

r_WaterDrawReflection 0
r_waterforcereflectentities 0
r_waterforceexpensive 0
nr_gbuffer_for_reflection_enabled 0
